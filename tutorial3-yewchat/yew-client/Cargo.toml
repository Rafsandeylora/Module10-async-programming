[package]
name = "yew-client"
version = "0.1.0"
edition = "2021"

[dependencies]
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "WebSocket",
    "MessageEvent",
    "Event",
    "ErrorEvent",
    "HtmlInputElement",
    "InputEvent",
    "KeyboardEvent",
    "console"
] }
yew = { version = "0.21", features = ["csr"] }